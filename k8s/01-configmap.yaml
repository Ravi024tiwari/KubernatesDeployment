apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  namespace: todo-production
  labels:
    app.kubernetes.io/part-of: todo-platform
data:
  NODE_ENV: "production"
  CORS_ORIGIN: "*"
  DNS_SERVERS: "1.1.1.1,1.0.0.1,8.8.8.8,8.8.4.4"
  # Ingress routes /api to backend and / to frontend on the same domain
  NEXT_PUBLIC_API_URL: "/api"
  # Cluster-internal DNS for Server-Side Rendering (pod-to-pod)
  INTERNAL_API_URL: "http://backend-service.todo-production.svc.cluster.local:5000/api"
