apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: todo-eks-cluster
  region: ap-south-1 # Mumbai (or change to us-east-1)
  version: "1.31"

# Enables IAM Roles for Service Accounts (IRSA) - required for AWS ALB Controller
iam:
  withOIDC: true

# Cost-optimized managed node group for learning & production testing
managedNodeGroups:
  - name: todo-workers
    instanceType: t3.medium
    minSize: 1
    maxSize: 3
    desiredCapacity: 2
    volumeSize: 20
    ssh:
      allow: false
    labels:
      role: worker
    tags:
      environment: production
      project: todo-platform
